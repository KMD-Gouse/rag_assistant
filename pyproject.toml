[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "annual-report-qa"
version = "0.1.0"
description = "Citation-focused Q&A over company annual reports"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "qdrant-client>=1,<2",
]
[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "evaluation*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires a running external service",
]